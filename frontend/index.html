<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Rengo AI" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous" />
    <!-- Noto Serif is self-hosted to guarantee it loads regardless of Google Fonts cache state -->
    <link rel="preload" href="/fonts/noto-serif-latin-variable.woff2" as="font" type="font/woff2" crossorigin="anonymous" />
    <link rel="preload" href="/fonts/noto-serif-latin-ext-variable.woff2" as="font" type="font/woff2" crossorigin="anonymous" />
    <style>
      /* latin-ext */
      @font-face {
        font-family: 'Noto Serif';
        font-style: normal;
        font-weight: 300 500;
        font-stretch: 100%;
        font-display: swap;
        src: url('/fonts/noto-serif-latin-ext-variable.woff2') format('woff2');
        unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;
      }
      /* latin */
      @font-face {
        font-family: 'Noto Serif';
        font-style: normal;
        font-weight: 300 500;
        font-stretch: 100%;
        font-display: swap;
        src: url('/fonts/noto-serif-latin-variable.woff2') format('woff2');
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }
    </style>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Chivo+Mono:wght@400;500&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&family=Inter+Tight:wght@400;500;600&family=Space+Mono:wght@400;700&display=swap"
    />
    <title>Rengo AI</title>
    <!-- Reb2b Tracking -->
    <script>
      !(function (key) {
        if (window.reb2b) return;
        window.reb2b = { loaded: true };
        var s = document.createElement("script");
        s.async = true;
        s.src =
          "https://ddwl4m2hdecbv.cloudfront.net/b/" + key + "/" + key + ".js.gz";
        document
          .getElementsByTagName("script")[0]
          .parentNode.insertBefore(s, document.getElementsByTagName("script")[0]);
      })("DNXY8HDJ3DO0");
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
    <!--
      Registers the self-destroying service worker in public/sw.js, which clears
      the caches left behind by the removed vite-plugin-pwa worker. Delete this
      tag and public/sw.js together once returning visitors have cycled through.
    -->
    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker.register("/sw.js");
        });
      }
    </script>
  </body>
</html>
