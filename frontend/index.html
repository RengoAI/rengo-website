<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Rengo AI" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Chivo+Mono:wght@400;500&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&family=Inter+Tight:wght@400;500;600&family=Noto+Serif:wght@300..500&family=Space+Mono:wght@400;700&display=swap"
    />
    <title>Rengo AI</title>
    <!-- Reb2b Tracking -->
    <script>
      !(function (key) {
        if (window.reb2b) return;
        window.reb2b = { loaded: true };
        var s = document.createElement("script");
        s.async = true;
        s.src =
          "https://ddwl4m2hdecbv.cloudfront.net/b/" + key + "/" + key + ".js.gz";
        document
          .getElementsByTagName("script")[0]
          .parentNode.insertBefore(s, document.getElementsByTagName("script")[0]);
      })("DNXY8HDJ3DO0");
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
    <!--
      Registers the self-destroying service worker in public/sw.js, which clears
      the caches left behind by the removed vite-plugin-pwa worker. Delete this
      tag and public/sw.js together once returning visitors have cycled through.
    -->
    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker.register("/sw.js");
        });
      }
    </script>
  </body>
</html>
