---
name: "Frontend PR Tests"
on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - frontend/**
      - .github/**

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_OPTIONS: "--max-old-space-size=8192"
  ACTOR: ${{ github.actor }}

jobs:
  test:
    if: github.base_ref != 'production'
    name: Test
    timeout-minutes: 15
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Setup node
        uses: ./.github/actions/node-setup

      # Text recipe variants (e.g. <Text variant="h1">) only type-check after
      # `chakra typegen`. Mirror the Lint workflow so tsc sees those types.
      - name: Auto-generate code
        run: pnpm run gen

      - name: Run lint
        run: pnpm run lint
